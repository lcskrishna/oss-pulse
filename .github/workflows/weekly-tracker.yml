name: Weekly Repo Tracker

on:
  schedule:
    - cron: '0 8 * * 1'   # Every Monday 8am UTC
  workflow_dispatch:        # Manual trigger from GitHub UI

permissions:
  contents: write

jobs:
  track:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install requests

      - name: Run tracker — ROCm/aiter
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python scripts/track_repo_changes.py \
            --repo ROCm/aiter \
            --format both

      - name: Run tracker — ROCm/mori
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python scripts/track_repo_changes.py \
            --repo ROCm/mori \
            --format both

      - name: Update root dashboard
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/update_dashboard.py

      - name: Commit reports
        run: |
          git config user.name  "oss-pulse[bot]"
          git config user.email "oss-pulse@users.noreply.github.com"
          git add reports/ README.md
          git diff --cached --quiet || git commit -m "chore: weekly report $(date -u +%Y-%m-%d)"
          git push
